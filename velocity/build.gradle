plugins {
    id 'java'
}

version = rootProject.findProperty("velocity_version") ?: rootProject.version
group = rootProject.group

base {
    archivesName = "multifabricserver-velocity"
}

repositories {
    mavenCentral()
    maven {
        name = "papermc"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly "com.velocitypowered:velocity-api:${rootProject.velocity_api_version}"
    annotationProcessor "com.velocitypowered:velocity-api:${rootProject.velocity_api_version}"
}

def generatedConstantsDir = layout.buildDirectory.dir("generated/sources/buildConstants/java")

tasks.register("generateBuildConstants") {
    inputs.property("version", project.version)
    outputs.dir(generatedConstantsDir)

    doLast {
        def constantsFile = generatedConstantsDir.get().file("fr/jeanney/velocity/BuildConstants.java").asFile
        constantsFile.parentFile.mkdirs()
        constantsFile.text = """package fr.jeanney.velocity;

final class BuildConstants {
    static final String VERSION = "${project.version}";

    private BuildConstants() {
    }
}
"""
    }
}

sourceSets {
    main {
        java.srcDir(generatedConstantsDir)
    }
}

compileJava.dependsOn(tasks.named("generateBuildConstants"))

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
